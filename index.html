<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Dashboard Financeiro CRUD</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- PWA Manifest -->
  <link
    rel="manifest"
    href='data:application/manifest+json,{"name":"Dashboard%20Financeiro","short_name":"Finan%C3%A7as","start_url":".","display":"standalone","background_color":"#111827","theme_color":"#111827","icons":[{"src":"https://placehold.co/192x192/111827/ffffff.png?text=Fin","type":"image/png","sizes":"192x192"},{"src":"https://placehold.co/512x512/111827/ffffff.png?text=Fin","type":"image/png","sizes":"512x512"}]}'
  />

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
    body {
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .pulsate-red { box-shadow: 0 0 0 0 rgba(239, 68, 68, 1); animation: pulse-red 2s infinite; }
    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .pulsate-yellow { box-shadow: 0 0 0 0 rgba(234, 179, 8, 1); animation: pulse-yellow 2s infinite; }
    @keyframes pulse-yellow {
      0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
      100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
    }

    /* Scrollbar leve (opcional) */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.25); }

    /* Guia de Despesas Styles */
    .guia-container {
      background: white;
      border-radius: 12px;
      padding: 15px;
      color: #333;
    }
    .guia-header {
      text-align: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 2px solid #667eea;
    }
    .guia-header h1 {
      font-size: 1.2em;
      color: #333;
      margin-bottom: 2px;
      font-weight: bold;
    }
    .guia-header p {
      font-size: 0.75em;
      color: #666;
    }
    .guia-expense-row {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid #f0f0f0;
      gap: 10px;
    }
    .guia-expense-row:hover {
      background: #f8f9fa;
    }
    .guia-expense-row:last-child {
      border-bottom: none;
    }
    .guia-brand-logo {
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.7em;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .guia-brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .logo-nubank { background: #820AD1; color: white; }
    .logo-next { background: #00D464; color: white; }
    .logo-inter { background: #FF7A00; color: white; }
    .logo-ifood { background: #EA1D2C; color: white; }
    .logo-99 { background: #FFD700; color: #000; }
    .logo-c6 { background: #000000; color: white; }
    .logo-ingles { background: #4285F4; color: white; }
    .logo-shopee { background: #EE4D2D; color: white; }

    .guia-expense-info {
      flex: 1;
      min-width: 0;
    }
    .guia-expense-info h3 {
      font-size: 0.9em;
      color: #333;
      margin-bottom: 2px;
      font-weight: 600;
    }
    .guia-expense-info p {
      font-size: 0.75em;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .guia-category-badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.65em;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-obra { background: #f5576c; color: white; }
    .badge-compras { background: #00f2fe; color: #333; }
    .badge-emergencia { background: #fee140; color: #333; }
    .badge-delivery { background: #EA1D2C; color: white; }
    .badge-transporte { background: #FFD700; color: #333; }
    .badge-lazer { background: #fecfef; color: #333; }
    .badge-mesada { background: #000000; color: white; }
    .badge-viagem { background: #820AD1; color: white; }
    .badge-aluguel { background: #820AD1; color: white; }
    .badge-ingles { background: #4285F4; color: white; }
    .badge-outras { background: #EE4D2D; color: white; }
  </style>
</head>

<body class="bg-gray-900 text-white">
  <div id="root"></div>

  <script type="text/babel">
    // =========================================================
    // DB INICIAL (atualizado com:
    // - Gabriel: dia 30 -> dia 5; dia 7 -> dia 12
    // - Aluguel: 650 e pago pela Letícia
    // - Transferência Letícia->Gabriel: 400 no dia 5
    // - Reserva unificada: virou Obra
    // =========================================================
    const initialDb = {
      usuarios: {
        gabriel: { nome: "Gabriel", emoji: "👨🏻" },
        leticia: { nome: "Leticia", emoji: "👩🏻" }
      },
      contas: {
        leticia: { id: "leticia", nome: "Conta Leticia", saldo: 0 },
        gabriel: { id: "gabriel", nome: "Conta Gabriel", saldo: 0 }
      },

      acoes: [
        // Dia 1 — Leticia
        {
          id: 1,
          dia: 1,
          responsavel: "leticia",
          evento: "Recebimentos e Pagamentos",
          tarefas: [
            { id: 101, descricao: "Receber Salário", origemDestino: "Crédito da Renda 1", tipo: "[+ RENDA]", valor: 1000, concluida: false, targetType: "conta", targetId: "leticia", operation: "add" },
            { id: 102, descricao: "Quitar Fatura da Obra", origemDestino: "Fatura do Cartão Nubank", tipo: "[🤖 AUTOMÁTICO]", valor: 1000, concluida: false, targetType: "conta", targetId: "leticia", operation: "subtract" }
          ]
        },

        // Dia 5 — Leticia (transferência para Gabriel)
        {
          id: 2,
          dia: 5,
          responsavel: "leticia",
          evento: "Transferência do Fundo de Metas",
          tarefas: [
            {
              id: 201,
              descricao: "Enviar Fundo de Metas",
              origemDestino: "Conta do Gabriel",
              tipo: "[🧑‍💻 MANUAL]",
              valor: 400,
              concluida: false,
              targetType: "conta",
              targetId: "gabriel",
              operation: "add",
              sourceType: "conta",
              sourceId: "leticia"
            }
          ]
        },

        // Dia 5 — Gabriel (era dia 30)
        {
          id: 3,
          dia: 5,
          responsavel: "gabriel",
          evento: "Renda e Pagamentos (novo dia)",
          tarefas: [
            { id: 301, descricao: "Receber Salário", origemDestino: "Crédito da Renda 2", tipo: "[+ RENDA]", valor: 600, concluida: false, targetType: "conta", targetId: "gabriel", operation: "add" },

            { id: 302, descricao: "Pagamentos Diversos", origemDestino: "Contas Diversas (Shopee)", tipo: "[🤖 AUTOMÁTICO]", valor: 185, concluida: false, targetType: "conta", targetId: "gabriel", operation: "subtract" },

            { id: 303, descricao: "Completar Meta Inglês (Parte 2)", origemDestino: "Plataforma de Inglês", tipo: "[🧑‍💻 MANUAL]", valor: 120, concluida: false,
              targetType: "caixinha", targetId: "ingles", operation: "add", sourceType: "conta", sourceId: "gabriel"
            },

            // Recargas: iFood 150 + Mesadas 300 + Lazer/99 Leticia 150 + Transporte/99 Gabriel 95 = 695
            { id: 304, descricao: "Recargas (iFood, Mesadas, 99)", origemDestino: "Carteiras/Cartões", tipo: "[🧑‍💻 MANUAL]", valor: 695, concluida: false,
              targetType: "multi",
              targets: [
                { type: "cartao", id: "delivery", value: 150 },
                { type: "cartao", id: "mesadaGabriel", value: 150 },
                { type: "cartao", id: "mesadaLeticia", value: 150 },
                { type: "cartao", id: "lazer", value: 150 },
                { type: "cartao", id: "transporte", value: 95 }
              ],
              sourceType: "conta",
              sourceId: "gabriel"
            }
          ]
        },

        // Dia 8 — Leticia (aluguel 650)
        {
          id: 4,
          dia: 8,
          responsavel: "leticia",
          evento: "Pagamento do Aluguel",
          tarefas: [
            // Resgatar da caixinha (caixinha -> conta)
            {
              id: 401,
              descricao: "Resgatar da Caixinha Aluguel",
              origemDestino: "Caixinha Nubank: Aluguel",
              tipo: "[🧑‍💻 MANUAL]",
              valor: 650,
              concluida: false,
              targetType: "conta",
              targetId: "leticia",
              operation: "add",
              sourceType: "caixinha",
              sourceId: "aluguel"
            },
            // Pagamento do aluguel (saída da conta)
            {
              id: 402,
              descricao: "Pagar Aluguel",
              origemDestino: "Locador do Imóvel",
              tipo: "[🧑‍💻 MANUAL]",
              valor: 650,
              concluida: false,
              targetType: "conta",
              targetId: "leticia",
              operation: "subtract"
            }
          ]
        },

        // Dia 12 — Gabriel (era dia 7)
        {
          id: 5,
          dia: 12,
          responsavel: "gabriel",
          evento: "Renda, Contas e Metas",
          tarefas: [
            { id: 501, descricao: "Receber Salário", origemDestino: "Crédito da Renda 1", tipo: "[+ RENDA]", valor: 1500, concluida: false, targetType: "conta", targetId: "gabriel", operation: "add" },
            { id: 502, descricao: "Pagar Conta Essencial", origemDestino: "Conta de Luz", tipo: "[🤖 AUTOMÁTICO]", valor: 120, concluida: false, targetType: "conta", targetId: "gabriel", operation: "subtract" },

            { id: 503, descricao: "Carregar Cartão COMPRAS MENSAL", origemDestino: "Cartão Pré-Pago Next", tipo: "[🧑‍💻 MANUAL]", valor: 700, concluida: false,
              targetType: "cartao", targetId: "compras", operation: "add", sourceType: "conta", sourceId: "gabriel"
            },

            // Reserva unificada -> Obra
            { id: 504, descricao: "Aporte Obra (Reserva unificada)", origemDestino: "Crédito Nubank (Obra)", tipo: "[🧑‍💻 MANUAL]", valor: 300, concluida: false,
              targetType: "caixinha", targetId: "obra", operation: "add", sourceType: "conta", sourceId: "gabriel"
            },

            { id: 505, descricao: "Abastecer Meta Viagem", origemDestino: "Caixinha Nubank: Viagem", tipo: "[🧑‍💻 MANUAL]", valor: 200, concluida: false,
              targetType: "caixinha", targetId: "viagem", operation: "add", sourceType: "conta", sourceId: "gabriel"
            },

            { id: 506, descricao: "Abastecer Meta Inglês (Parte 1)", origemDestino: "Plataforma de Inglês", tipo: "[🧑‍💻 MANUAL]", valor: 180, concluida: false,
              targetType: "caixinha", targetId: "ingles", operation: "add", sourceType: "conta", sourceId: "gabriel"
            }
          ]
        },

        // Dia 15 — Leticia (sem transferência de 400)
        {
          id: 6,
          dia: 15,
          responsavel: "leticia",
          evento: "Renda e Provisionamentos",
          tarefas: [
            { id: 601, descricao: "Receber Salário", origemDestino: "Crédito da Renda 2", tipo: "[+ RENDA]", valor: 1000, concluida: false, targetType: "conta", targetId: "leticia", operation: "add" },
            { id: 602, descricao: "Abastecer Meta Aluguel", origemDestino: "Caixinha Nubank: Aluguel", tipo: "[🧑‍💻 MANUAL]", valor: 650, concluida: false,
              targetType: "caixinha", targetId: "aluguel", operation: "add", sourceType: "conta", sourceId: "leticia"
            }
          ]
        }
      ],

      caixinhas: {
        obra: { id: "obra", nome: "Obra (Reserva Unificada)", saldo: 0, meta: 0 },
        viagem: { id: "viagem", nome: "Viagem", saldo: 0, meta: 200 },
        ingles: { id: "ingles", nome: "Inglês", saldo: 0, meta: 300 },
        aluguel: { id: "aluguel", nome: "Aluguel", saldo: 0, meta: 650 }
      },

      cartoes: {
        compras: { id: "compras", nome: "Compras Mensais (Next)", saldo: 0, limite: 700 },
        delivery: { id: "delivery", nome: "Delivery (iFood)", saldo: 0, limite: 150 },
        mesadaGabriel: { id: "mesadaGabriel", nome: "Mesada Gabriel (C6)", saldo: 0, limite: 150 },
        mesadaLeticia: { id: "mesadaLeticia", nome: "Mesada Leticia (C6)", saldo: 0, limite: 150 },
        lazer: { id: "lazer", nome: "Lazer (99 Leticia)", saldo: 0, limite: 150 },
        transporte: { id: "transporte", nome: "Transporte (99 Gabriel)", saldo: 0, limite: 95 }
      }
    };

    // =========================================================
    // APP
    // =========================================================
    const App = () => {
      const { useState, useEffect, useMemo } = React;

      const [db, setDb] = useState(() => {
        const savedDb = localStorage.getItem("financeDb");
        try {
          const parsedDb = savedDb ? JSON.parse(savedDb) : initialDb;
          if (!parsedDb.contas) parsedDb.contas = initialDb.contas;
          if (!parsedDb.caixinhas) parsedDb.caixinhas = initialDb.caixinhas;
          if (!parsedDb.cartoes) parsedDb.cartoes = initialDb.cartoes;
          if (!parsedDb.usuarios) parsedDb.usuarios = initialDb.usuarios;
          if (!parsedDb.acoes) parsedDb.acoes = initialDb.acoes;
          return parsedDb;
        } catch (e) {
          console.error("Failed to parse localStorage data, resetting to initial data.", e);
          return initialDb;
        }
      });

      const [today, setToday] = useState(new Date().getDate());
      const [checklistActionId, setChecklistActionId] = useState(null);
      const [editingActionId, setEditingActionId] = useState(null);

      // Filtro por responsável (mantém o seu comportamento atual)
      const [view, setView] = useState("todos"); // 'todos' | 'leticia' | 'gabriel'

      // NOVO: modo de visualização
      const [mode, setMode] = useState("timeline"); // 'timeline' | 'planilha'

      const [isManagementModalOpen, setIsManagementModalOpen] = useState(false);
      const [isGuiaModalOpen, setIsGuiaModalOpen] = useState(false);

      useEffect(() => {
        localStorage.setItem("financeDb", JSON.stringify(db));
      }, [db]);

      useEffect(() => {
        // processa automático e renda até o dia atual
        const nowDay = new Date().getDate();
        let needsUpdate = false;
        const newDb = JSON.parse(JSON.stringify(db));

        const executeTransaction = (task) => {
          const multiplier = 1;

          // Debitar a origem quando existir (conta ou caixinha)
          if (task.sourceType && task.sourceId) {
            const sourceCollection =
              task.sourceType === "conta" ? "contas" :
              task.sourceType === "caixinha" ? "caixinhas" : null;

            if (sourceCollection) {
              const sourceItem = newDb[sourceCollection]?.[task.sourceId];
              if (sourceItem) sourceItem.saldo -= task.valor * multiplier;
            }
          }

          // Aplicar destino(s)
          if (task.targetType === "multi") {
            (task.targets || []).forEach((target) => {
              const collectionName = target.type === "caixinha" ? "caixinhas" : "cartoes";
              const itemToUpdate = newDb[collectionName]?.[target.id];
              if (itemToUpdate) itemToUpdate.saldo += (target.value || 0) * multiplier;
            });
          } else if (task.targetType && task.targetId) {
            const { targetType, targetId, valor, operation } = task;
            const collectionName =
              targetType === "conta" ? "contas" :
              targetType === "caixinha" ? "caixinhas" : "cartoes";

            const itemToUpdate = newDb[collectionName]?.[targetId];
            if (itemToUpdate) itemToUpdate.saldo += (operation === "subtract" ? -valor : valor) * multiplier;
          }
        };

        newDb.acoes.forEach((action) => {
          if (action.dia <= nowDay) {
            action.tarefas.forEach((task) => {
              if ((task.tipo === "[🤖 AUTOMÁTICO]" || task.tipo === "[+ RENDA]") && !task.concluida) {
                needsUpdate = true;
                executeTransaction(task);
                task.concluida = true;
              }
            });
          }
        });

        if (needsUpdate) setDb(newDb);
      }, []);

      const getDayStatus = (day) => {
        const diff = day - today;
        if (diff < 0) return "passado";
        if (diff === 0) return "hoje";
        if (diff <= 2) return "proximo";
        return "futuro";
      };

      const handleSaveAction = (actionToSave) => {
        setDb((prevDb) => {
          const existingAction = prevDb.acoes.find((a) => a.id === actionToSave.id);
          if (existingAction) {
            return { ...prevDb, acoes: prevDb.acoes.map((a) => (a.id === actionToSave.id ? actionToSave : a)) };
          }
          return { ...prevDb, acoes: [...prevDb.acoes, actionToSave] };
        });
      };

      const handleToggleTask = (actionId, taskId) => {
        setDb((prevDb) => {
          const newDb = JSON.parse(JSON.stringify(prevDb));
          let taskToUpdate;

          // acha tarefa
          newDb.acoes.forEach((a) => a.tarefas.forEach((t) => { if (t.id === taskId) taskToUpdate = t; }));
          if (!taskToUpdate) return prevDb;

          const isCompleting = !taskToUpdate.concluida;
          const multiplier = isCompleting ? 1 : -1;

          // origem (conta/caixinha)
          if (taskToUpdate.sourceType && taskToUpdate.sourceId) {
            const sourceCollection =
              taskToUpdate.sourceType === "conta" ? "contas" :
              taskToUpdate.sourceType === "caixinha" ? "caixinhas" : null;

            if (sourceCollection) {
              const sourceItem = newDb[sourceCollection]?.[taskToUpdate.sourceId];
              if (sourceItem) sourceItem.saldo -= taskToUpdate.valor * multiplier;
            }
          }

          // destino(s)
          if (taskToUpdate.targetType === "multi") {
            (taskToUpdate.targets || []).forEach((target) => {
              const collectionName = target.type === "caixinha" ? "caixinhas" : "cartoes";
              const itemToUpdate = newDb[collectionName]?.[target.id];
              if (itemToUpdate) itemToUpdate.saldo += (target.value || 0) * multiplier;
            });
          } else if (taskToUpdate.targetType && taskToUpdate.targetId) {
            const { targetType, targetId, valor, operation } = taskToUpdate;
            const collectionName =
              targetType === "conta" ? "contas" :
              targetType === "caixinha" ? "caixinhas" : "cartoes";

            const itemToUpdate = newDb[collectionName]?.[targetId];
            if (itemToUpdate) itemToUpdate.saldo += (operation === "subtract" ? -valor : valor) * multiplier;
          }

          taskToUpdate.concluida = isCompleting;
          return newDb;
        });
      };

      const handleToggleTaskType = (taskId, e) => {
        e.stopPropagation();
        setDb((prevDb) => {
          const newDb = JSON.parse(JSON.stringify(prevDb));
          let taskToUpdate;

          for (const acao of newDb.acoes) {
            const foundTask = acao.tarefas.find((t) => t.id === taskId);
            if (foundTask) {
              taskToUpdate = foundTask;
              break;
            }
          }

          if (taskToUpdate) {
            if (taskToUpdate.tipo === "[🤖 AUTOMÁTICO]") taskToUpdate.tipo = "[🧑‍💻 MANUAL]";
            else if (taskToUpdate.tipo === "[🧑‍💻 MANUAL]") taskToUpdate.tipo = "[🤖 AUTOMÁTICO]";
          }

          return newDb;
        });
      };

      const resetData = () => {
        if (window.confirm("Tem certeza que deseja resetar TODOS os dados para o padrão inicial?")) {
          localStorage.removeItem("financeDb");
          setDb(initialDb);
        }
      };

      // =======================
      // Helpers Planilha
      // =======================
      const formatMoney = (n) =>
        (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

      const getTaskSymbol = (task) => {
        // Transferência conta -> conta
        if (task.sourceType === "conta" && task.targetType === "conta") {
          const from = db.usuarios?.[task.sourceId]?.emoji || "👤";
          const to = db.usuarios?.[task.targetId]?.emoji || "👤";
          return `${from}→${to}`;
        }

        // Caixinha (conta<->caixinha)
        if (task.targetType === "caixinha" || task.sourceType === "caixinha") return "📦";

        // Multi (recargas)
        if (task.targetType === "multi") return "💳";

        // Entrada
        if (task.tipo === "[+ RENDA]") return "+";

        // Saída
        if (task.operation === "subtract") return "-";

        return "•";
      };

      const getSignedDisplay = (task) => {
        // mostra sinal amigável, inclusive para transferência/caixinha (do ponto de vista do responsável)
        const symbol = getTaskSymbol(task);
        if (symbol === "+") return { label: `+ ${formatMoney(task.valor)}`, color: "text-green-400" };
        if (symbol === "-") return { label: `- ${formatMoney(task.valor)}`, color: "text-red-400" };
        if (symbol === "💳") return { label: `- ${formatMoney(task.valor)}`, color: "text-yellow-300" }; // sai da conta (source)
        if (symbol === "📦") return { label: `${formatMoney(task.valor)}`, color: "text-cyan-300" };
        if (symbol.includes("→")) return { label: `→ ${formatMoney(task.valor)}`, color: "text-yellow-300" };
        return { label: formatMoney(task.valor), color: "text-gray-200" };
      };

      const filteredAcoes = useMemo(() => {
        const sorted = [...db.acoes].sort((a, b) => a.dia - b.dia);
        return sorted.filter((acao) => view === "todos" || acao.responsavel === view);
      }, [db.acoes, view]);

      const flatRows = useMemo(() => {
        const rows = [];
        filteredAcoes.forEach((acao) => {
          acao.tarefas.forEach((task) => {
            rows.push({
              actionId: acao.id,
              taskId: task.id,
              dia: acao.dia,
              responsavel: acao.responsavel,
              evento: acao.evento,
              descricao: task.descricao,
              origemDestino: task.origemDestino,
              tipo: task.tipo,
              valor: task.valor,
              concluida: task.concluida,
              symbol: getTaskSymbol(task),
              signed: getSignedDisplay(task),
              task
            });
          });
        });

        // Ordenação: dia crescente, entradas primeiro, depois resto
        const rank = (t) => {
          const sym = getTaskSymbol(t);
          if (sym === "+") return 1;
          if (sym.includes("→")) return 2;
          if (sym === "[*]") return 3;
          if (sym === "-") return 4;
          if (sym === "📦") return 5;
          return 99;
        };

        rows.sort((a, b) => a.dia - b.dia || rank(a.task) - rank(b.task));
        return rows;

                          <select value={task.tipo} onChange={(e) => handleTaskChange(task.id, "tipo", e.target.value)} className="bg-gray-600 p-1 rounded w-full text-sm">
                            <option value="[🧑‍💻 MANUAL]">🧑‍💻 MANUAL</option>
                            <option value="[🤖 AUTOMÁTICO]">🤖 AUTOMÁTICO</option>
                            <option value="[+ RENDA]">+ RENDA</option>
                          </select>
                        </div>
                      ))}
                    </div>

                    <button onClick={handleAddTask} className="mt-4 w-full text-sm bg-blue-500/20 text-blue-300 py-2 rounded-lg hover:bg-blue-500/40">
                      Adicionar Tarefa
                    </button>
                  </div>

                  <div className="flex justify-between items-center mt-6 pt-4 border-t border-gray-700 flex-shrink-0">
                    <button onClick={() => handleDeleteAction(action.id)} className="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">
                      Apagar
                    </button>
                    <div>
                      <button onClick={() => setEditingActionId(null)} className="text-gray-400 font-bold py-2 px-4 rounded-lg mr-2">
                        Cancelar
                      </button>
                      <button onClick={handleSave} className="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-lg">
                        Salvar
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          };

          // =========================================================
          // ManagementModal (mantido do seu projeto)
          // =========================================================
          const ManagementModal = () => {
            const [localDb, setLocalDb] = React.useState(() => JSON.parse(JSON.stringify(db)));

            const handleItemChange = (itemType, itemId, field, value) => {
              setLocalDb((p) => {
                const newItems = { ...p[itemType] };
                const target = newItems[itemId];

                if (field === "meta" || field === "limite") {
                  if (itemType === "caixinhas") target.meta = value;
                  else target.limite = value;
                } else {
                  target[field] = value;
                }

                return { ...p, [itemType]: newItems };
              });
            };

            const handleAddItem = (itemType) => {
              const newId = `new_${Date.now()}`;
              const newItem =
                itemType === "caixinhas"
                  ? { id: newId, nome: "Nova Caixinha", saldo: 0, meta: 100 }
                  : { id: newId, nome: "Novo Cartão", saldo: 0, limite: 100 };

              setLocalDb((p) => ({ ...p, [itemType]: { ...p[itemType], [newId]: newItem } }));
            };

            const handleLocalDeleteItem = (itemType, itemId) => {
              if (window.confirm("Apagar este item?")) {
                setLocalDb((p) => {
                  const newItems = { ...p[itemType] };
                  delete newItems[itemId];
                  return { ...p, [itemType]: newItems };
                });
              }
            };

            const handleSaveAll = () => {
              setDb(localDb);
              setIsManagementModalOpen(false);
            };

            const renderItemEditor = (item, itemType) => (
              <div key={item.id} className="bg-gray-700/50 p-3 rounded-lg space-y-2">
                <div>
                  <label className="text-xs text-gray-400 font-medium">Nome</label>
                  <input value={item.nome} onChange={(e) => handleItemChange(itemType, item.id, "nome", e.target.value)} className="bg-gray-600 p-2 rounded w-full mt-1 text-sm" />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs text-gray-400 font-medium">Saldo</label>
                    <input type="number" step="0.01" value={item.saldo} onChange={(e) => handleItemChange(itemType, item.id, "saldo", parseFloat(e.target.value) || 0)} className="bg-gray-600 p-2 rounded w-full mt-1 text-sm" />
                  </div>

                  <div>
                    <label className="text-xs text-gray-400 font-medium">{itemType === "caixinhas" ? "Meta" : "Limite"}</label>
                    <input
                      type="number"
                      step="0.01"
                      value={itemType === "caixinhas" ? item.meta : item.limite}
                      onChange={(e) => handleItemChange(itemType, item.id, itemType === "caixinhas" ? "meta" : "limite", parseFloat(e.target.value) || 0)}
                      className="bg-gray-600 p-2 rounded w-full mt-1 text-sm"
                    />
                  </div>
                </div>

                <button onClick={() => handleLocalDeleteItem(itemType, item.id)} className="w-full text-sm bg-red-500/10 text-red-400 py-2 rounded-lg hover:bg-red-500/20">
                  Apagar
                </button>
              </div>
            );

            return (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-0 sm:p-4" onClick={() => setIsManagementModalOpen(false)}>
                <div className="bg-gray-800 w-full h-full sm:h-[90vh] sm:max-w-4xl rounded-none sm:rounded-2xl shadow-2xl border border-gray-700 p-4 sm:p-6 flex flex-col" onClick={(e) => e.stopPropagation()}>
                  <div className="flex justify-between items-center mb-4 flex-shrink-0">
                    <h2 className="text-xl font-bold">Gerenciar Finanças</h2>
                    <button onClick={() => setIsManagementModalOpen(false)} className="text-gray-500 hover:text-white text-3xl">&times;</button>
                  </div>

                  <div className="flex-grow overflow-y-auto pr-2 grid grid-cols-1 lg:grid-cols-3 gap-x-6 gap-y-4">
                    <div className="lg:col-span-1">
                      <h3 className="text-lg font-semibold mb-3 text-cyan-400">Caixinhas</h3>
                      <div className="space-y-3">{Object.values(localDb.caixinhas).map((item) => renderItemEditor(item, "caixinhas"))}</div>
                      <button onClick={() => handleAddItem("caixinhas")} className="mt-4 w-full text-sm bg-blue-500/20 text-blue-300 py-2 rounded-lg hover:bg-blue-500/40">
                        Adicionar Caixinha
                      </button>
                    </div>

                    <div className="lg:col-span-1">
                      <h3 className="text-lg font-semibold mb-3 text-green-400">Cartões</h3>
                      <div className="space-y-3">{Object.values(localDb.cartoes).map((item) => renderItemEditor(item, "cartoes"))}</div>
                      <button onClick={() => handleAddItem("cartoes")} className="mt-4 w-full text-sm bg-blue-500/20 text-blue-300 py-2 rounded-lg hover:bg-blue-500/40">
                        Adicionar Cartão
                      </button>
                    </div>

                    <div className="lg:col-span-1">
                      <h3 className="text-lg font-semibold mb-3 text-yellow-400">Eventos</h3>
                      <div className="space-y-2">
                        {[...localDb.acoes].sort((a, b) => a.dia - b.dia).map((action) => (
                          <div key={action.id} className="bg-gray-700/50 p-2 rounded-lg flex justify-between items-center">
                            <div className="text-sm">
                              <span className="font-bold">Dia {action.dia}:</span> {action.evento}
                            </div>
                            <button
                              onClick={() => {
                                setIsManagementModalOpen(false);
                                setEditingActionId(action.id);
                              }}
                              className="text-xs bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-md hover:bg-yellow-500/40"
                            >
                              Editar
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="mt-6 flex justify-end flex-shrink-0 pt-4 border-t border-gray-700">
                    <button onClick={() => setIsManagementModalOpen(false)} className="text-gray-400 font-bold py-2 px-4 rounded-lg mr-2">
                      Cancelar
                    </button>
                    <button onClick={handleSaveAll} className="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-lg">
                      Salvar Tudo
                    </button>
                  </div>
                </div>
              </div>
            );
          };

          // =========================================================
          // Render principal
          // =========================================================
          return (
            <div className="min-h-screen pb-20">
              <Header />
              <main>
                <ContasPanel />
                <div className="px-3 sm:px-4"><div className="border-t border-gray-700/50"></div></div>

                <CaixinhasPanel />
                <div className="px-3 sm:px-4"><div className="border-t border-gray-700/50"></div></div>

                <CartoesPanel />
                <ViewSwitcher />

                {mode === "planilha" ? <SpreadsheetView /> : <Timeline />}
              </main>

              {checklistActionId && <ChecklistModal />}
              {editingActionId && <EditActionModal />}
              {isManagementModalOpen && <ManagementModal />}
              {isGuiaModalOpen && <GuiaModal onClose={() => setIsGuiaModalOpen(false)} />}

              <button
                onClick={() => {
                  const newAction = { id: Date.now(), dia: new Date().getDate(), responsavel: "gabriel", evento: "Novo Evento", tarefas: [] };
                  handleSaveAction(newAction);
                  setEditingActionId(newAction.id);
                }}
                className="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 bg-cyan-600 text-white w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-2xl sm:text-3xl shadow-lg hover:bg-cyan-700 transition-transform hover:scale-110 z-30"
              >
                +
              </button>
            </div>
          );
        };

        const container = document.getElementById("root");
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
      </script>
    </body>
    </html>
