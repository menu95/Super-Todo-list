<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro CRUD</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json,{
        &quot;name&quot;: &quot;Dashboard Financeiro&quot;,
        &quot;short_name&quot;: &quot;Finanças&quot;,
        &quot;start_url&quot;: &quot;.&quot;,
        &quot;display&quot;: &quot;standalone&quot;,
        &quot;background_color&quot;: &quot;#111827&quot;,
        &quot;theme_color&quot;: &quot;#111827&quot;,
        &quot;icons&quot;: [
            {
                &quot;src&quot;: &quot;https://placehold.co/192x192/111827/ffffff?text=Fin&quot;,
                &quot;type&quot;: &quot;image/png&quot;,
                &quot;sizes&quot;: &quot;192x192&quot;
            },
            {
                &quot;src&quot;: &quot;https://placehold.co/512x512/111827/ffffff?text=Fin&quot;,
                &quot;type&quot;: &quot;image/png&quot;,
                &quot;sizes&quot;: &quot;512x512&quot;
            }
        ]
    }">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .pulsate-red { box-shadow: 0 0 0 0 rgba(239, 68, 68, 1); animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .pulsate-yellow { box-shadow: 0 0 0 0 rgba(234, 179, 8, 1); animation: pulse-yellow 2s infinite; }
        @keyframes pulse-yellow {
            0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
            /* Expense Tracker Styles (Dark Theme) */
            .total-section { background: linear-gradient(135deg, #4c51bf 0%, #6b46c1 100%); color: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
            .total-section h2 { font-size: 0.9em; margin-bottom: 5px; opacity: 0.9; }
            .total-section .amount { font-size: 1.8em; font-weight: bold; }
            .expense-row { display: flex; align-items: center; padding: 8px 10px; border-bottom: 1px solid #2d3748; gap: 8px; }
            .expense-row:hover { background: #2d3748; }
            .expense-row:last-child { border-bottom: none; }
            .brand-logo { width: 36px; height: 36px; min-width: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.7em; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
            .logo-nubank { background: #820AD1; color: white; } .logo-next { background: #00D464; color: white; } .logo-inter { background: #FF7A00; color: white; } .logo-ifood { background: #EA1D2C; color: white; } .logo-99 { background: #FFD700; color: #000; } .logo-c6 { background: #1f2937; color: white; } .logo-recargapay { background: #1f2937; color: white; } .logo-shopee { background: #EE4D2D; color: white; }
            .expense-info { flex: 1; min-width: 0; }
            .expense-info h3 { font-size: 0.85em; color: #e2e8f0; margin-bottom: 2px; font-weight: 600; }
            .expense-info p { font-size: 0.7em; color: #a0aec0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .payment-date { font-size: 0.7em; color: #a3bffa; font-weight: 600; background: #2d3748; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
            .payment-date.empty { color: #718096; background: #2d3748; }
            .value-display { font-size: 0.95em; font-weight: bold; color: #a3bffa; min-width: 75px; text-align: right; }
            .value-display.zero { color: #718096; }
            .action-buttons { display: flex; gap: 4px; }
            .icon-btn { background: #4c51bf; color: white; border: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 0.85em; transition: background 0.3s; display: flex; align-items: center; justify-content: center; }
            .icon-btn:hover { background: #434190; }
            .icon-btn.pix-btn { background: #00A383; }
            .icon-btn.pix-btn:hover { background: #008a6d; }
            .category-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.65em; font-weight: 600; white-space: nowrap; }
            .badge-obra { background: #c53030; color: white; } .badge-compras { background: #00b5d8; color: white; } .badge-emergencia { background: #d69e2e; color: white; } .badge-delivery { background: #c53030; color: white; } .badge-transporte { background: #d69e2e; color: white; } .badge-lazer { background: #b794f4; color: white; } .badge-mesada { background: #4a5568; color: white; } .badge-viagem { background: #805ad5; color: white; } .badge-aluguel { background: #805ad5; color: white; } .badge-ingles { background: #38a169; color: white; } .badge-outras { background: #dd6b20; color: white; }
            .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center; }
            .modal.active { display: flex; }
            .modal-content { background: #1a202c; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; border: 1px solid #4a5568; }
            .modal-header h2 { font-size: 1.2em; color: #e2e8f0; margin-bottom: 5px; }
            .modal-header p { font-size: 0.85em; color: #a0aec0; }
            .form-group label { display: block; font-size: 0.85em; color: #a0aec0; margin-bottom: 5px; font-weight: 600; }
            .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #4a5568; border-radius: 8px; font-size: 1em; transition: border-color 0.3s; font-family: inherit; background: #2d3748; color: #e2e8f0; }
            .form-group textarea { resize: vertical; min-height: 80px; }
            .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
            .modal-footer { display: flex; gap: 10px; justify-content: flex-end; }
            .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.9em; font-weight: 600; cursor: pointer; transition: all 0.3s; }
            .btn-cancel { background: #4a5568; color: #a0aec0; } .btn-cancel:hover { background: #2d3748; }
            .btn-save { background: #4c51bf; color: white; } .btn-save:hover { background: #434190; }
            .reset-btn { background: #c53030; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.75em; font-weight: 600; margin-top: 10px; width: 100%; }
            .reset-btn:hover { background: #9b2c2c; }
            .pix-display { background: #2d3748; padding: 12px; border-radius: 8px; margin-top: 15px; border: 2px dashed #00A383; }
            .pix-display h3 { font-size: 0.9em; color: #e2e8f0; margin-bottom: 8px; }
            .pix-key { background: #1a202c; padding: 10px; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 0.85em; color: #e2e8f0; word-break: break-all; margin-bottom: 10px; }
            .copy-btn { background: #00A383; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: 600; width: 100%; transition: background 0.3s; }
            .copy-btn:hover { background: #008a6d; }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div id="root"></div>

    <script type="text/babel">
        const ExpenseTracker = () => {
            const { useState, useEffect } = React;

            const expensesConfig = [
                { id: 'obra', name: 'Obra', logo: 'Nu', logoClass: 'logo-nubank', description: 'Crédito Nubank', badge: '🏗️', badgeClass: 'badge-obra' },
                { id: 'compras', name: 'Compras Mensais', logo: 'next', logoClass: 'logo-next', description: 'Cartão Next', badge: '🛒', badgeClass: 'badge-compras' },
                { id: 'emergencia', name: 'Reserva de Emergência', logo: 'inter', logoClass: 'logo-inter', description: 'Inter Leticia', badge: '🆘', badgeClass: 'badge-emergencia' },
                { id: 'delivery', name: 'Delivery', logo: 'iFood', logoClass: 'logo-ifood', description: 'iFood', badge: '🍕', badgeClass: 'badge-delivery' },
                { id: 'transporte', name: 'Transporte', logo: '99', logoClass: 'logo-99', description: '99 Gabriel', badge: '🚗', badgeClass: 'badge-transporte', logoStyle: { fontSize: '1em', fontWeight: '900' } },
                { id: 'lazer', name: 'Lazer', logo: '99', logoClass: 'logo-99', description: '99 Leticia', badge: '🎉', badgeClass: 'badge-lazer', logoStyle: { fontSize: '1em', fontWeight: '900' } },
                { id: 'mesada_gabriel', name: 'Mesada Gabriel', logo: 'C6', logoClass: 'logo-c6', description: 'C6 Bank Gabriel', badge: '👦', badgeClass: 'badge-mesada' },
                { id: 'mesada_leticia', name: 'Mesada Leticia', logo: 'C6', logoClass: 'logo-c6', description: 'C6 Bank Leticia', badge: '👧', badgeClass: 'badge-mesada' },
                { id: 'viagem', name: 'Viagem', logo: 'Nu', logoClass: 'logo-nubank', description: 'Caixinha Nubank', badge: '✈️', badgeClass: 'badge-viagem' },
                { id: 'aluguel', name: 'Aluguel', logo: 'Nu', logoClass: 'logo-nubank', description: 'Caixinha Nubank', badge: '🏠', badgeClass: 'badge-aluguel' },
                { id: 'ingles', name: 'Inglês', logo: '$ pay', logoClass: 'logo-recargapay', description: 'Recarga Pay', badge: '📚', badgeClass: 'badge-ingles' },
                { id: 'demais', name: 'Demais Contas', logo: 'Shopee', logoClass: 'logo-shopee', description: 'Conta Shopee Gabriel', badge: '📊', badgeClass: 'badge-outras', logoStyle: { fontSize: '0.65em' } }
            ];

            const [expenseData, setExpenseData] = useState({});
            const [totalAmount, setTotalAmount] = useState(0);
            const [isEditModalOpen, setEditModalOpen] = useState(false);
            const [isPixModalOpen, setPixModalOpen] = useState(false);
            const [currentExpense, setCurrentExpense] = useState(null);
            const [formValue, setFormValue] = useState('');
            const [formDueDate, setFormDueDate] = useState('');
            const [formPixKey, setFormPixKey] = useState('');

            useEffect(() => {
                const savedData = localStorage.getItem('expenseTrackerData');
                const data = savedData ? JSON.parse(savedData) : {};
                setExpenseData(data);
            }, []);

            useEffect(() => {
                const total = Object.values(expenseData).reduce((sum, item) => sum + (parseFloat(item.value) || 0), 0);
                setTotalAmount(total);
                localStorage.setItem('expenseTrackerData', JSON.stringify(expenseData));
            }, [expenseData]);

            const formatCurrency = (value) => {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);
            };

            const openEditModal = (expense) => {
                setCurrentExpense(expense);
                const data = expenseData[expense.id] || {};
                setFormValue(data.value || 0);
                setFormDueDate(data.dueDate || '');
                setFormPixKey(data.pixKey || '');
                setEditModalOpen(true);
            };

            const closeEditModal = () => {
                setEditModalOpen(false);
                setCurrentExpense(null);
            };

            const handleSave = () => {
                if (!currentExpense) return;
                const updatedData = {
                    ...expenseData,
                    [currentExpense.id]: {
                        value: parseFloat(formValue) || 0,
                        dueDate: formDueDate,
                        pixKey: formPixKey.trim()
                    }
                };
                setExpenseData(updatedData);
                closeEditModal();
            };

            const openPixModal = (expense) => {
                setCurrentExpense(expense);
                setPixModalOpen(true);
            };

            const closePixModal = () => {
                setPixModalOpen(false);
                setCurrentExpense(null);
            };

            const handleResetAll = () => {
                if (confirm('Tem certeza que deseja zerar todos os valores, datas e chaves PIX?')) {
                    setExpenseData({});
                }
            };

            const copyPixKey = (pixKey) => {
                if (!pixKey) return;
                navigator.clipboard.writeText(pixKey).then(() => {
                    alert('Chave PIX copiada!');
                }).catch(err => {
                    alert('Erro ao copiar: ' + err);
                });
            };

            return (
                <div className="p-3 sm:p-4">
                    <div className="total-section">
                        <h2>Total a Repassar</h2>
                        <div className="amount">{formatCurrency(totalAmount)}</div>
                    </div>

                    <div id="expensesList">
                        {expensesConfig.map(expense => {
                            const data = expenseData[expense.id] || {};
                            const value = data.value || 0;
                            const dueDate = data.dueDate || '';
                            const valueClass = value > 0 ? '' : 'zero';
                            const dateClass = dueDate ? '' : 'empty';
                            const dateText = dueDate ? `Dia ${dueDate}` : 'Sem data';

                            return (
                                <div className="expense-row" key={expense.id}>
                                    <div className={`brand-logo ${expense.logoClass}`} style={expense.logoStyle || {}}>{expense.logo}</div>
                                    <div className="expense-info">
                                        <h3>{expense.name}</h3>
                                        <p>{expense.description}</p>
                                    </div>
                                    <span className={`payment-date ${dateClass}`}>{dateText}</span>
                                    <div className={`value-display ${valueClass}`}>{formatCurrency(value)}</div>
                                    <div className="action-buttons">
                                        <button className="icon-btn" onClick={() => openEditModal(expense)} title="Editar">✏️</button>
                                        <button className="icon-btn pix-btn" onClick={() => openPixModal(expense)} title="Ver PIX">💳</button>
                                    </div>
                                    <span className={`category-badge ${expense.badgeClass}`}>{expense.badge}</span>
                                </div>
                            );
                        })}
                    </div>
                    <button className="reset-btn" onClick={handleResetAll}>Zerar Todos os Valores</button>

                    {isEditModalOpen && currentExpense && (
                        <div className="modal active">
                            <div className="modal-content">
                                <div className="modal-header">
                                    <h2>Editar {currentExpense.name}</h2>
                                    <p>{currentExpense.description}</p>
                                </div>
                                <div className="modal-body">
                                    <div className="form-group">
                                        <label htmlFor="valueInput">Valor (R$)</label>
                                        <input type="number" id="valueInput" step="0.01" min="0" placeholder="0.00"
                                            value={formValue} onChange={e => setFormValue(e.target.value)} />
                                    </div>
                                    <div className="form-group">
                                        <label htmlFor="dueDateInput">Dia do Vencimento</label>
                                        <input type="number" id="dueDateInput" min="1" max="31" placeholder="Ex: 15"
                                            value={formDueDate} onChange={e => setFormDueDate(e.target.value)} />
                                        <p className="help-text">Dia do mês para pagamento</p>
                                    </div>
                                    <div className="form-group">
                                        <label htmlFor="pixKeyInput">Chave PIX</label>
                                        <textarea id="pixKeyInput" placeholder="Cole a chave PIX aqui..."
                                            value={formPixKey} onChange={e => setFormPixKey(e.target.value)}></textarea>
                                        <p className="help-text">Deixe em branco se não houver PIX cadastrado</p>
                                    </div>
                                </div>
                                <div className="modal-footer">
                                    <button className="btn btn-cancel" onClick={closeEditModal}>Cancelar</button>
                                    <button className="btn btn-save" onClick={handleSave}>Salvar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isPixModalOpen && currentExpense && (
                        <div className="modal active">
                            <div className="modal-content">
                                <div className="modal-header">
                                    <h2>Dados para Pagamento - {currentExpense.name}</h2>
                                    <p>{currentExpense.description}</p>
                                </div>
                                <div className="modal-body">
                                    <div className="pix-display">
                                        <h3>📱 Chave PIX</h3>
                                        <div className="pix-key">
                                            {expenseData[currentExpense.id]?.pixKey || 'Nenhuma chave cadastrada'}
                                        </div>
                                        <button className="copy-btn" onClick={() => copyPixKey(expenseData[currentExpense.id]?.pixKey)}>
                                            📋 Copiar Chave PIX
                                        </button>
                                    </div>
                                </div>
                                <div className="modal-footer">
                                    <button className="btn btn-cancel" onClick={closePixModal}>Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const initialDb = {
            usuarios: {
                gabriel: { nome: "Gabriel", emoji: "👨🏻" },
                leticia: { nome: "Leticia", emoji: "👩🏻" }
            },
            contas: {
                leticia: { id: 'leticia', nome: 'Conta Leticia', saldo: 0 },
                gabriel: { id: 'gabriel', nome: 'Conta Gabriel', saldo: 0 }
            },
            acoes: [
                { id: 1, dia: 1, responsavel: "leticia", evento: "Recebimentos e Pagamentos", tarefas: [
                    { id: 101, descricao: "Receber Salário", origemDestino: "Crédito da Renda 1", tipo: "[+ RENDA]", valor: 1000, concluida: false, targetType: 'conta', targetId: 'leticia', operation: 'add' },
                    { id: 102, descricao: "Quitar Fatura da Obra", origemDestino: "Fatura do Cartão Nubank", tipo: "[🤖 AUTOMÁTICO]", valor: 1000, concluida: false, targetType: 'conta', targetId: 'leticia', operation: 'subtract' }
                ]},
                { id: 2, dia: 5, responsavel: "gabriel", evento: "Renda, Contas e Metas", tarefas: [
                    { id: 201, descricao: "Receber Salário", origemDestino: "Crédito da Renda 1", tipo: "[+ RENDA]", valor: 1500, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'add' },
                    { id: 202, descricao: "Pagar Conta Essencial", origemDestino: "Conta de Luz", tipo: "[🤖 AUTOMÁTICO]", valor: 120, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'subtract' },
                    { id: 203, descricao: "Carregar Cartão COMPRAS", origemDestino: "Cartão Pré-Pago Next", tipo: "[🧑‍💻 MANUAL]", valor: 650, concluida: false, targetType: 'cartao', targetId: 'compras', operation: 'add', sourceType: 'conta', sourceId: 'gabriel' },
                    { id: 204, descricao: "Abastecer Meta Reserva", origemDestino: "Caixinha Nubank: Reserva", tipo: "[🧑‍💻 MANUAL]", valor: 300, concluida: false, targetType: 'caixinha', targetId: 'reserva', operation: 'add', sourceType: 'conta', sourceId: 'gabriel' },
                    { id: 205, descricao: "Abastecer Meta Viagem", origemDestino: "Caixinha Nubank: Viagem", tipo: "[🧑‍💻 MANUAL]", valor: 200, concluida: false, targetType: 'caixinha', targetId: 'viagem', operation: 'add', sourceType: 'conta', sourceId: 'gabriel' },
                ]},
                { id: 3, dia: 7, responsavel: "gabriel", evento: "Pagamento do Aluguel", tarefas: [
                    { id: 301, descricao: "Pagar Aluguel", origemDestino: "Locador do Imóvel", tipo: "[🧑‍💻 MANUAL]", valor: 600, concluida: false, targetType: 'caixinha', targetId: 'aluguel', operation: 'subtract' },
                ]},
                { id: 4, dia: 15, responsavel: "leticia", evento: "Renda e Transferências", tarefas: [
                    { id: 401, descricao: "Receber Salário", origemDestino: "Crédito da Renda 2", tipo: "[+ RENDA]", valor: 1000, concluida: false, targetType: 'conta', targetId: 'leticia', operation: 'add' },
                    { id: 402, descricao: "Abastecer Meta Aluguel", origemDestino: "Caixinha Nubank: Aluguel", tipo: "[🧑‍💻 MANUAL]", valor: 600, concluida: false, targetType: 'caixinha', targetId: 'aluguel', operation: 'add', sourceType: 'conta', sourceId: 'leticia' },
                    { id: 403, descricao: "Enviar Fundo de Metas", origemDestino: "Conta do Gabriel", tipo: "[🧑‍💻 MANUAL]", valor: 400, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'add', sourceType: 'conta', sourceId: 'leticia' },
                ]},
                { id: 5, dia: 30, responsavel: "gabriel", evento: "Renda e Pagamentos Finais", tarefas: [
                    { id: 501, descricao: "Receber Salário", origemDestino: "Crédito da Renda 2", tipo: "[+ RENDA]", valor: 600, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'add' },
                    { id: 502, descricao: "Receber Fundo de Metas", origemDestino: "Transferência de Leticia", tipo: "[+ RENDA]", valor: 400, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'add' },
                    { id: 503, descricao: "Abastecer Meta Inglês", origemDestino: "Caixinha Nubank: Inglês", tipo: "[🧑‍💻 MANUAL]", valor: 300, concluida: false, targetType: 'caixinha', targetId: 'ingles', operation: 'add', sourceType: 'conta', sourceId: 'gabriel' },
                    { id: 504, descricao: "Recarregar Cartões", origemDestino: "Cartões Pré-Pagos", tipo: "[🧑‍💻 MANUAL]", valor: 600, concluida: false, targetType: 'multi', targets: [{type:'cartao', id:'delivery', value:150}, {type:'cartao', id:'mesada', value:300}, {type:'cartao', id:'lazer', value:150}], sourceType: 'conta', sourceId: 'gabriel' },
                    { id: 505, descricao: "Pagamentos Diversos", origemDestino: "Contas Diversas", tipo: "[🤖 AUTOMÁTICO]", valor: 100, concluida: false, targetType: 'conta', targetId: 'gabriel', operation: 'subtract' },
                ]}
            ],
            caixinhas: {
                reserva: { id: 'reserva', nome: "Reserva de Emergência", saldo: 0, meta: 300 },
                viagem: { id: 'viagem', nome: "Viagem Anual", saldo: 0, meta: 200 },
                ingles: { id: 'ingles', nome: "Curso de Inglês", saldo: 0, meta: 300 },
                aluguel: { id: 'aluguel', nome: "Aluguel", saldo: 0, meta: 600 },
                arquiteto: { id: 'arquiteto', nome: "Arquiteto", saldo: 0, meta: 145 }
            },
            cartoes: {
                compras: { id: 'compras', nome: "Compras", saldo: 0, limite: 650 },
                delivery: { id: 'delivery', nome: "Delivery", saldo: 0, limite: 150 },
                mesada: { id: 'mesada', nome: "Mesada Pessoal", saldo: 0, limite: 300 },
                lazer: { id: 'lazer', nome: "Lazer", saldo: 0, limite: 150 }
            }
        };

        const App = () => {
            const { useState, useEffect, useMemo } = React;

            const [db, setDb] = useState(() => {
                const savedDb = localStorage.getItem('financeDb');
                try {
                    const parsedDb = savedDb ? JSON.parse(savedDb) : initialDb;
                    if (!parsedDb.contas) parsedDb.contas = initialDb.contas;
                    return parsedDb;
                } catch (e) {
                    console.error("Failed to parse localStorage data, resetting to initial data.", e);
                    return initialDb;
                }
            });

            const [today, setToday] = useState(new Date().getDate());
            const [checklistActionId, setChecklistActionId] = useState(null);
            const [editingActionId, setEditingActionId] = useState(null);
            const [view, setView] = useState('todos');
            const [isManagementModalOpen, setIsManagementModalOpen] = useState(false);

            useEffect(() => {
                localStorage.setItem('financeDb', JSON.stringify(db));
            }, [db]);

            useEffect(() => {
                const today = new Date().getDate();
                let needsUpdate = false;
                const newDb = JSON.parse(JSON.stringify(db));

                const executeTransaction = (task) => {
                    const multiplier = 1; // Always process as completion
                    if(task.sourceType && task.sourceId) {
                        const sourceItem = newDb[task.sourceType === 'conta' ? 'contas' : 'caixinhas'][task.sourceId];
                        if (sourceItem) sourceItem.saldo -= task.valor * multiplier;
                    }

                    if (task.targetType === 'multi') {
                        task.targets.forEach(target => {
                            const itemToUpdate = newDb[target.type === 'caixinha' ? 'caixinhas' : 'cartoes'][target.id];
                            if (itemToUpdate) itemToUpdate.saldo += target.value * multiplier;
                        });
                    } else if (task.targetType && task.targetId) {
                        const { targetType, targetId, valor, operation } = task;
                        const collectionName = targetType === 'conta' ? 'contas' : (targetType === 'caixinha' ? 'caixinhas' : 'cartoes');
                        const itemToUpdate = newDb[collectionName][targetId];
                        if (itemToUpdate) itemToUpdate.saldo += (operation === 'subtract' ? -valor : valor) * multiplier;
                    }
                };

                newDb.acoes.forEach(action => {
                    if (action.dia <= today) {
                        action.tarefas.forEach(task => {
                            if ((task.tipo === '[🤖 AUTOMÁTICO]' || task.tipo === '[+ RENDA]') && !task.concluida) {
                                needsUpdate = true;
                                executeTransaction(task);
                                task.concluida = true;
                            }
                        });
                    }
                });

                if (needsUpdate) {
                    setDb(newDb);
                }
            }, []);


            const filteredAcoes = useMemo(() => {

            const getDayStatus = (day) => {
                const diff = day - today;

            };

            // Handlers
            const handleSaveAction = (actionToSave) => {
                setDb(prevDb => {

                    return {...prevDb, acoes: [...prevDb.acoes, actionToSave]};
                });
            };

            const handleToggleTask = (actionId, taskId) => {
                setDb(prevDb => {
                    const newDb = JSON.parse(JSON.stringify(prevDb));
                    let taskToUpdate;
                    newDb.acoes.forEach(a => a.tarefas.forEach(t => { if(t.id === taskId) taskToUpdate = t; }));
                    if (!taskToUpdate) return prevDb;

                    const isCompleting = !taskToUpdate.concluida;
                    const multiplier = isCompleting ? 1 : -1;

                    if(taskToUpdate.sourceType && taskToUpdate.sourceId) {
                        const sourceItem = newDb[taskToUpdate.sourceType === 'conta' ? 'contas' : 'caixinhas'][taskToUpdate.sourceId];
                        if (sourceItem) sourceItem.saldo -= taskToUpdate.valor * multiplier;
                    }

                    if (taskToUpdate.targetType === 'multi') {
                        taskToUpdate.targets.forEach(target => {
                            const itemToUpdate = newDb[target.type === 'caixinha' ? 'caixinhas' : 'cartoes'][target.id];
                            if (itemToUpdate) itemToUpdate.saldo += target.value * multiplier;
                        });
                    } else if (taskToUpdate.targetType && taskToUpdate.targetId) {
                        const { targetType, targetId, valor, operation } = taskToUpdate;
                        const collectionName = targetType === 'conta' ? 'contas' : (targetType === 'caixinha' ? 'caixinhas' : 'cartoes');
                        const itemToUpdate = newDb[collectionName][targetId];
                        if (itemToUpdate) itemToUpdate.saldo += (operation === 'subtract' ? -valor : valor) * multiplier;
                    }
                    taskToUpdate.concluida = isCompleting;
                    return newDb;
                });

                    for (const acao of newDb.acoes) {

                        if (foundTask) {
                            taskToUpdate = foundTask;
                            break;
                        }
                    }

                    if (taskToUpdate) {
                        // Alterna o tipo da tarefa entre automático e manual
                        if (taskToUpdate.tipo === '[🤖 AUTOMÁTICO]') {
                            taskToUpdate.tipo = '[🧑‍💻 MANUAL]';

                            taskToUpdate.tipo = '[🤖 AUTOMÁTICO]';

                    }

                    return newDb;

                const handleSaveAll = () => { setDb(localDb); setIsManagementModalOpen(false); };

                const renderItemEditor = (item, itemType) => (<div key={item.id} className="bg-gray-700/50 p-3 rounded-lg space-y-2"> <div><label className="text-xs text-gray-400 font-medium">Nome</label><input value={item.nome} onChange={e => handleItemChange(itemType, item.id, 'nome', e.target.value)} className="bg-gray-600 p-2 rounded w-full mt-1 text-sm"/></div> <div className="grid grid-cols-2 gap-2"><div><label className="text-xs text-gray-400 font-medium">Saldo</label><input type="number" step="0.01" value={item.saldo} onChange={e => handleItemChange(itemType, item.id, 'saldo', parseFloat(e.target.value) || 0)} className="bg-gray-600 p-2 rounded w-full mt-1 text-sm"/></div> <div><label className="text-xs text-gray-400 font-medium">{itemType === 'caixinhas' ? 'Meta' : 'Limite'}</label><input type="number" step="0.01" value={itemType === 'caixinhas' ? item.meta : item.limite} onChange={e => handleItemChange(itemType, item.id, itemType === 'caixinhas' ? 'meta' : 'limite', parseFloat(e.target.value) || 0)} className="bg-gray-600 p-2 rounded w-full mt-1 text-sm"/></div></div> <button onClick={() => handleLocalDeleteItem(itemType, item.id)} className="w-full text-sm bg-red-500/10 text-red-400 py-2 rounded-lg hover:bg-red-500/20">Apagar</button> </div>);

                 return (<div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-0 sm:p-4" onClick={() => setIsManagementModalOpen(false)}> <div className="bg-gray-800 w-full h-full sm:h-[90vh] sm:max-w-4xl rounded-none sm:rounded-2xl shadow-2xl border border-gray-700 p-4 sm:p-6 flex flex-col" onClick={e => e.stopPropagation()}> <div className="flex justify-between items-center mb-4 flex-shrink-0"><h2 className="text-xl font-bold">Gerenciar Finanças</h2><button onClick={() => setIsManagementModalOpen(false)} className="text-gray-500 hover:text-white text-3xl">&times;</button></div> <div className="flex-grow overflow-y-auto pr-2 grid grid-cols-1 lg:grid-cols-3 gap-x-6 gap-y-4"> <div className="lg:col-span-1"> <h3 className="text-lg font-semibold mb-3 text-cyan-400">Caixinhas</h3> <div className="space-y-3">{Object.values(localDb.caixinhas).map(item => renderItemEditor(item, 'caixinhas'))}</div> <button onClick={() => handleAddItem('caixinhas')} className="mt-4 w-full text-sm bg-blue-500/20 text-blue-300 py-2 rounded-lg hover:bg-blue-500/40">Adicionar Caixinha</button> </div> <div className="lg:col-span-1"> <h3 className="text-lg font-semibold mb-3 text-green-400">Cartões</h3> <div className="space-y-3">{Object.values(localDb.cartoes).map(item => renderItemEditor(item, 'cartoes'))}</div> <button onClick={() => handleAddItem('cartoes')} className="mt-4 w-full text-sm bg-blue-500/20 text-blue-300 py-2 rounded-lg hover:bg-blue-500/40">Adicionar Cartão</button> </div> <div className="lg:col-span-1"> <h3 className="text-lg font-semibold mb-3 text-yellow-400">Eventos</h3> <div className="space-y-2">{[...localDb.acoes].sort((a,b)=> a.dia-b.dia).map(action => (<div key={action.id} className="bg-gray-700/50 p-2 rounded-lg flex justify-between items-center"><div className="text-sm"><span className="font-bold">Dia {action.dia}:</span> {action.evento}</div> <button onClick={() => { setIsManagementModalOpen(false); setEditingActionId(action.id); }} className="text-xs bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-md hover:bg-yellow-500/40">Editar</button></div>))}</div> </div> </div> <div className="mt-6 flex justify-end flex-shrink-0 pt-4 border-t border-gray-700"><button onClick={() => setIsManagementModalOpen(false)} className="text-gray-400 font-bold py-2 px-4 rounded-lg mr-2">Cancelar</button> <button onClick={handleSaveAll} className="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-lg">Salvar Tudo</button></div> </div> </div>);
            };

            return (
                 <div className="min-h-screen pb-20">
                    <Header />
                     <main>
                        {view !== 'despesas' && (
                            <>
                                <ContasPanel />
                                <div className="px-3 sm:px-4"><div className="border-t border-gray-700/50"></div></div>
                                <CaixinhasPanel />
                                <div className="px-3 sm:px-4"><div className="border-t border-gray-700/50"></div></div>
                                <CartoesPanel />
                            </>
                        )}
                        <ViewSwitcher />
                        {view === 'despesas' ? <ExpenseTracker /> : <Timeline />}
                    </main>
                    {checklistActionId && <ChecklistModal />}
                    {editingActionId && <EditActionModal />}
                    {isManagementModalOpen && <ManagementModal />}
                    {view !== 'despesas' && (
                        <button onClick={() => { const newAction = { id: Date.now(), dia: new Date().getDate(), responsavel: 'gabriel', evento: 'Novo Evento', tarefas: []}; handleSaveAction(newAction); setEditingActionId(newAction.id); }} className="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 bg-cyan-600 text-white w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center text-2xl sm:text-3xl shadow-lg hover:bg-cyan-700 transition-transform hover:scale-110 z-30">+</button>
                    )}
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
